<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Gestión de Mantenimientos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="container d-flex flex-column align-items-center">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <i class="bi bi-tools"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">SGMT Portal</h3>
                    <p class="text-muted small">Gestión de Mantenimientos Tecnológicos</p>
                </div>
                
                <div class="alert alert-danger d-none" id="login-feedback" role="alert">
                    Credenciales inválidas. Intente nuevamente.
                </div>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="txt-usuario" class="form-label small fw-semibold text-secondary">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="txt-usuario" placeholder="ej. admin" required autocomplete="username">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="txt-clave" class="form-label small fw-semibold text-secondary">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="txt-clave" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-pres w-100 py-2 fw-semibold"><i class="bi bi-box-arrow-in-right"></i> Entrar al Sistema</button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted small">¿No tienes cuenta? <a href="registro.html" class="text-primary fw-semibold">Regístrate aquí</a></p>
                </div>
            </div>

            <!-- Panel informativo de usuarios de prueba (Naranja Negocio/Control) -->
            <div class="card mt-4 shadow border-0" style="max-width: 450px; background-color: var(--color-neg-light); border-left: 5px solid var(--color-neg-accent) !important;">
                <div class="card-body p-3">
                    <h6 class="text-dark fw-bold mb-2"><i class="bi bi-info-circle text-danger"></i> Cuentas de Prueba Pre-cargadas</h6>
                    <div class="table-responsive">
                        <table class="table table-sm table-borderless mb-0" style="font-size: 0.8rem;">
                            <thead>
                                <tr class="text-secondary border-bottom">
                                    <th>Usuario</th>
                                    <th>Clave</th>
                                    <th>Rol</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><code class="text-dark">admin</code></td>
                                    <td><code class="text-dark">admin123</code></td>
                                    <td><span class="badge bg-primary text-white">Administrador</span></td>
                                </tr>
                                <tr>
                                    <td><code class="text-dark">tecnico1</code></td>
                                    <td><code class="text-dark">tec123</code></td>
                                    <td><span class="badge bg-warning text-dark">Técnico</span></td>
                                </tr>
                                <tr>
                                    <td><code class="text-dark">cliente1</code></td>
                                    <td><code class="text-dark">cli123</code></td>
                                    <td><span class="badge bg-success text-white">Cliente</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cargar Scripts en Orden de Dependencia -->
    <script src="js/data/repositorio.js"></script>
    <script src="js/patterns/composite.js"></script>
    <script src="js/patterns/bridge.js"></script>
    <script src="js/business/controlador.js"></script>
    <script src="js/patterns/proxy.js"></script>
    <script src="js/presentation/ui.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
