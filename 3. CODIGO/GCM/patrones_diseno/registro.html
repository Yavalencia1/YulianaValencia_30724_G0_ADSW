<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Sistema de Gestión de Mantenimientos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="container d-flex flex-column align-items-center">
            <div class="login-card" style="max-width: 750px;">
                <div class="login-header">
                    <div class="login-logo">
                        <i class="bi bi-person-plus"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Registro de Cliente</h3>
                    <p class="text-muted small">Crea tu cuenta para gestionar tus mantenimientos</p>
                </div>
                
                <div class="alert alert-danger d-none" id="registro-feedback" role="alert"></div>
                <div class="alert alert-success d-none" id="registro-exito" role="alert">
                    ¡Registro exitoso! Redireccionando al portal de ingreso...
                </div>

                <form id="registro-form">
                    <div class="row">
                        <!-- Nombre Completo -->
                        <div class="col-md-6 mb-3">
                            <label for="txt-nombre" class="form-label small fw-semibold text-secondary">Nombre Completo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="txt-nombre" placeholder="ej. Juan Pérez" required>
                            </div>
                        </div>
                        <!-- Usuario -->
                        <div class="col-md-6 mb-3">
                            <label for="txt-usuario" class="form-label small fw-semibold text-secondary">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person-badge"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="txt-usuario" placeholder="ej. jperez" required autocomplete="username">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Correo Electrónico -->
                        <div class="col-md-6 mb-3">
                            <label for="txt-correo" class="form-label small fw-semibold text-secondary">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="txt-correo" placeholder="ej. jperez@mail.com" required>
                            </div>
                        </div>
                        <!-- Cédula -->
                        <div class="col-md-6 mb-3">
                            <label for="txt-cedula" class="form-label small fw-semibold text-secondary">Cédula</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-card-text"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="txt-cedula" placeholder="ej. 1723456789" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Teléfono -->
                        <div class="col-md-6 mb-3">
                            <label for="txt-telefono" class="form-label small fw-semibold text-secondary">Teléfono</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="txt-telefono" placeholder="ej. 0987654321" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Contraseña -->
                        <div class="col-md-6 mb-3">
                            <label for="txt-clave" class="form-label small fw-semibold text-secondary">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control border-x-0 ps-0" id="txt-clave" placeholder="••••••••" required autocomplete="new-password">
                                <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" id="btn-toggle-password" style="border-color: #dee2e6;">
                                    <i class="bi bi-eye" id="toggle-password-icon"></i>
                                </button>
                            </div>
                        </div>
                        <!-- Confirmar Contraseña -->
                        <div class="col-md-6 mb-4">
                            <label for="txt-confirmar-clave" class="form-label small fw-semibold text-secondary">Confirmar Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key-fill"></i></span>
                                <input type="password" class="form-control border-x-0 ps-0" id="txt-confirmar-clave" placeholder="••••••••" required autocomplete="new-password">
                                <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" id="btn-toggle-confirm-password" style="border-color: #dee2e6;">
                                    <i class="bi bi-eye" id="toggle-confirm-password-icon"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-pres w-100 py-2 fw-semibold"><i class="bi bi-check-circle"></i> Registrarse</button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted small">¿Ya tienes cuenta? <a href="login.html" class="text-primary fw-semibold">Inicia sesión aquí</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Cargar Scripts en Orden de Dependencia -->
    <script src="js/data/repositorio.js"></script>
    <script src="js/patterns/composite.js"></script>
    <script src="js/patterns/bridge.js"></script>
    <script src="js/business/controlador.js"></script>
    <script src="js/patterns/proxy.js"></script>
    <script src="js/presentation/ui.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
