<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Sistema de Gestión de Mantenimientos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="container d-flex flex-column align-items-center">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <i class="bi bi-shield-exclamation"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Cambiar Contraseña</h3>
                    <p class="text-muted small">Por seguridad, debes cambiar tu contraseña temporal antes de continuar.</p>
                </div>
                
                <div class="alert alert-danger d-none" id="change-feedback" role="alert"></div>
                <div class="alert alert-success d-none" id="change-exito" role="alert">
                    ¡Contraseña actualizada con éxito! Accediendo al sistema...
                </div>

                <form id="change-password-form">
                    <!-- Usuario (Lectura) -->
                    <div class="mb-3">
                        <label for="txt-usuario-change" class="form-label small fw-semibold text-secondary">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0 bg-light" id="txt-usuario-change" readonly>
                        </div>
                    </div>
                    <!-- Contraseña Actual (Temporal) -->
                    <div class="mb-3">
                        <label for="txt-clave-actual" class="form-label small fw-semibold text-secondary">Contraseña Actual (Temporal)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control border-x-0 ps-0" id="txt-clave-actual" placeholder="••••••••" required>
                            <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" id="btn-toggle-actual" style="border-color: #dee2e6;">
                                <i class="bi bi-eye" id="toggle-actual-icon"></i>
                            </button>
                        </div>
                    </div>
                    <!-- Nueva Contraseña -->
                    <div class="mb-3">
                        <label for="txt-nueva-clave" class="form-label small fw-semibold text-secondary">Nueva Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control border-x-0 ps-0" id="txt-nueva-clave" placeholder="Mínimo 6 caracteres" required>
                            <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" id="btn-toggle-nueva" style="border-color: #dee2e6;">
                                <i class="bi bi-eye" id="toggle-nueva-icon"></i>
                            </button>
                        </div>
                    </div>
                    <!-- Confirmar Nueva Contraseña -->
                    <div class="mb-4">
                        <label for="txt-confirmar-nueva" class="form-label small fw-semibold text-secondary">Confirmar Nueva Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-check-lg"></i></span>
                            <input type="password" class="form-control border-x-0 ps-0" id="txt-confirmar-nueva" placeholder="Repita la nueva contraseña" required>
                            <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" id="btn-toggle-confirmar" style="border-color: #dee2e6;">
                                <i class="bi bi-eye" id="toggle-confirmar-icon"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-pres w-100 py-2 fw-semibold"><i class="bi bi-check-circle"></i> Actualizar y Entrar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Cargar Scripts en Orden de Dependencia -->
    <script src="js/data/repositorio.js"></script>
    <script src="js/patterns/composite.js"></script>
    <script src="js/patterns/bridge.js"></script>
    <script src="js/business/controlador.js"></script>
    <script src="js/patterns/proxy.js"></script>
    <script src="js/presentation/ui.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
