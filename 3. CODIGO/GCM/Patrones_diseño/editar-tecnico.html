<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Técnico - Sistema de Gestión de Mantenimientos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="app-container">
        <!-- Contenedor del Sidebar (Inyectado por JS) -->
        <div id="sidebar-container"></div>

        <!-- Contenido Principal -->
        <main class="main-content">
            <!-- Barra Superior (Inyectada por JS) -->
            <div id="navbar-container"></div>

            <!-- Migas de Pan (Breadcrumbs) -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb bg-white p-3 rounded shadow-sm">
                    <li class="breadcrumb-item"><a href="tecnicos.html" class="text-decoration-none fw-semibold">Técnicos</a></li>
                    <li class="breadcrumb-item active" aria-current="page" id="breadcrumb-action">Cargando...</li>
                </ol>
            </nav>

            <!-- Formulario Dedicado -->
            <div class="card card-dashboard p-4 mb-4">
                <div class="border-bottom pb-2 mb-4 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold text-dark mb-0" id="form-title">Registrar / Editar Técnico</h5>
                    <a href="tecnicos.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
                </div>

                <form id="form-tecnico">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="tec-correo" class="form-label small fw-semibold text-secondary">Correo Electrónico</label>
                            <input type="email" class="form-control" id="tec-correo" placeholder="ej. carlos@mantenimiento.com" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="tec-nombre" class="form-label small fw-semibold text-secondary">Nombre Completo</label>
                            <input type="text" class="form-control" id="tec-nombre" placeholder="ej. Carlos Gómez" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="tec-especialidad" class="form-label small fw-semibold text-secondary">Especialidad Técnica</label>
                            <input type="text" class="form-control" id="tec-especialidad" placeholder="ej. Celulares / Laptops" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="tec-telefono" class="form-label small fw-semibold text-secondary">Teléfono de Contacto</label>
                            <input type="text" class="form-control" id="tec-telefono" placeholder="ej. 0988888888" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top pt-3">
                        <a href="tecnicos.html" class="btn btn-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-pres px-4" id="btn-guardar-tecnico">Guardar Técnico</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Cargar Scripts en Orden de Dependencia -->
    <script src="js/data/repositorio.js"></script>
    <script src="js/patterns/composite.js"></script>
    <script src="js/patterns/bridge.js"></script>
    <script src="js/business/controlador.js"></script>
    <script src="js/patterns/proxy.js"></script>
    <script src="js/presentation/ui.js"></script>
</body>
</html>
