<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Mantenimientos - Sistema de Gestión de Mantenimientos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="css/estilos.css">
    <!-- html2pdf.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- Contenedor del Sidebar (Inyectado por JS) -->
        <div id="sidebar-container"></div>

        <!-- Contenido Principal -->
        <main class="main-content">
            <!-- Barra Superior (Inyectada por JS) -->
            <div id="navbar-container"></div>

            <!-- Panel de Mantenimientos -->
            <div class="card card-dashboard p-4 mb-4">
                <div class="row align-items-center mb-3">
                    <div class="col-md-6 mb-2 mb-md-0">
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-search"></i></span>
                            <input type="text" id="buscar-mantenimiento" class="form-control" placeholder="Buscar por Cód. Mantenimiento, equipo, marca o estado...">
                        </div>
                    </div>
                    <div class="col-md-6 text-md-end" id="actions-container">
                        <button class="btn btn-pres" id="btn-nuevo-mantenimiento">
                            <i class="bi bi-plus-circle"></i> Registrar Mantenimiento
                        </button>
                    </div>
                </div>

                <!-- Fila de Filtros Avanzados -->
                <div class="row g-2 mb-4">
                    <div class="col-md-4 col-sm-6">
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted small"><i class="bi bi-funnel"></i> Estado</span>
                            <select id="filtro-estado" class="form-select">
                                <option value="Todos" selected>Todos los estados</option>
                                <option value="Recibido">Recibido</option>
                                <option value="En Reparación">En Reparación</option>
                                <option value="Listo para Entrega">Listo para Entrega</option>
                                <option value="Entregado">Entregado</option>
                                <option value="Cancelado">Cancelado</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4 col-sm-6">
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted small"><i class="bi bi-calendar3"></i> Mes</span>
                            <input type="month" id="filtro-mes" class="form-control">
                        </div>
                    </div>
                    <div class="col-md-4 col-sm-12 text-md-start">
                        <button id="btn-limpiar-filtros" class="btn btn-outline-secondary w-100">
                            <i class="bi bi-trash"></i> Limpiar Filtros
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle border-top mb-0" id="tabla-mantenimientos">
                        <thead class="table-light">
                            <tr>
                                <th>Cód. Ticket</th>
                                <th>Equipo / Dispositivo</th>
                                <th>Tipo</th>
                                <th>Fecha Ingreso</th>
                                <th>Estado</th>
                                <th>Costos (Abono / Saldo)</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-mantenimientos-body">
                            <!-- Los mantenimientos se cargarán dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Terminal de Auditoría & Notificaciones (Inyectada por JS) 
            <div id="console-container"></div>-->
        </main>
    </div>



    <!-- Cargar Scripts en Orden de Dependencia -->
    <script src="js/data/repositorio.js"></script>
    <script src="js/patterns/composite.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
    emailjs.init({
        publicKey: "Kj5RwLEQxagjbu5bp"
    });
    </script>
    <script src="js/patterns/bridge.js"></script>
    <script src="js/business/controlador.js"></script>
    <script src="js/patterns/proxy.js"></script>
    <script src="js/presentation/ui.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de ajuste fino para rol Cliente en el HTML -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Asegurarse de que si es Cliente, se oculte el botón de registrar nuevo
            const sesion = window.controlador.sesionActiva;
            if (sesion && sesion.rol === 'Cliente') {
                const btnNuevo = document.getElementById('btn-nuevo-mantenimiento');
                if (btnNuevo) btnNuevo.style.display = 'none';
            }
        });
    </script>
</body>
</html>
